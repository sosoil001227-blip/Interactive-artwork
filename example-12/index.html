<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3eb" />
    <meta name="description" content="얼굴을 집고, 늘리고, 비틀어 보세요. 두 손으로 만나는 말랑한 나, 고무 인간." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>고무 인간 · Example 12</title>
  </head>
  <body>
    <video id="camera" autoplay muted playsinline hidden></video>
    <header class="topbar">
      <a class="brand" href="/example-12/" aria-label="고무 인간 처음으로"><span class="brand-icon" aria-hidden="true">↝</span> 말랑한 실험실 <span class="edition">EXPERIMENT 012</span></a>
      <nav class="examples" aria-label="예제 선택">
        <a href="/example-8/" title="WaterTouch">08</a><a href="/example-9/" title="magic">09</a><a href="/example-10/" title="Jelly Black Hole">10</a><a href="/example-11/" title="PUPPET SHOW">11</a><a href="/example-12/" aria-current="page">12 <span>고무 인간</span></a>
        <a href="/example-13/" aria-label="13 마스크">13 <span>마스크</span></a>
        <a href="/example-14/" aria-label="14 DDR MACHINE">14 <span>DDR MACHINE</span></a>
      </nav>
    </header>

    <main class="workspace">
      <section class="playground" aria-label="고무 얼굴 인터랙션">
        <div class="stage" id="stage">
          <canvas id="background" aria-hidden="true"></canvas>
          <canvas id="surface" aria-label="손끝에 잡혀 고무처럼 늘어나고 비틀리는 얼굴"></canvas>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div class="stage-top"><span class="stage-label"><span class="dot"></span><span id="status" role="status">카메라 연결 중…</span></span><span id="face-status" class="face-status">고무 인간 · 실시간 인터랙티브 미러</span></div>
          <div id="camera-notice" class="camera-notice" hidden>
            <p id="error" class="error" role="alert" hidden></p>
            <button id="start" type="button">카메라 다시 연결 ↗</button>
          </div>
          <div id="live-info" class="live-info" hidden><span id="grip-count">0 / 2 PINCH</span><span id="stretch-value">STRETCH 0%</span></div>
        </div>
        <div class="live-controls" id="controls">
          <div class="guide"><span class="dot"></span><p id="guide" role="status">카메라 접근을 허용하면 바로 시작합니다.</p></div>
          <div class="buttons"><button id="markers" type="button" aria-pressed="true" disabled>손끝 표시</button><button id="reset" type="button" disabled>↺ 원래대로</button><button id="stop" class="stop" type="button" hidden><span aria-hidden="true">■</span> <span id="stop-label">연결 취소</span></button></div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
